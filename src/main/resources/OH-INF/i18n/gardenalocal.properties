# channel types

channel-type.gardenalocal.ambient-temperature.label = Air Temperature
channel-type.gardenalocal.ambient-temperature.description = The air temperature (smart Sensor only).
channel-type.gardenalocal.battery-level.label = Battery Level
channel-type.gardenalocal.battery-level.description = Battery charge in percent.
channel-type.gardenalocal.charging-cycles.label = Charging Cycles
channel-type.gardenalocal.charging-cycles.description = Completed charging cycles over the mower's lifetime (first-generation mowers).
channel-type.gardenalocal.collisions.label = Collisions
channel-type.gardenalocal.collisions.description = Collisions over the mower's lifetime (first-generation mowers).
channel-type.gardenalocal.cutting-time.label = Cutting Time
channel-type.gardenalocal.cutting-time.description = How long the cutting disc has been running over the mower's lifetime (first-generation mowers).
channel-type.gardenalocal.dripping-alert.label = Dripping Alert
channel-type.gardenalocal.dripping-alert.description = When the pump reports a small leakage: after 60 minutes of dripping (standard), after 2 minutes (sensitive), or never (off).
channel-type.gardenalocal.dripping-alert.state.option.standard = After 60 minutes
channel-type.gardenalocal.dripping-alert.state.option.sensitive = After 2 minutes
channel-type.gardenalocal.dripping-alert.state.option.off = Off
channel-type.gardenalocal.flow-rate.label = Flow Rate
channel-type.gardenalocal.flow-rate.description = The water flow while the pump runs, 0 while it stands. The pump reports it in steps of about 76 l/h.
channel-type.gardenalocal.flow-since-reset.label = Volume Since Reset
channel-type.gardenalocal.flow-since-reset.description = The water pumped since the counter was last reset with the reset-flow command.
channel-type.gardenalocal.flow-total.label = Total Volume
channel-type.gardenalocal.flow-total.description = The water pumped over the pump's lifetime.
channel-type.gardenalocal.frost-warning.label = Frost Warning
channel-type.gardenalocal.frost-warning.description = ON while the temperature is below about 5 °C.
channel-type.gardenalocal.last-seen.label = Last Seen
channel-type.gardenalocal.last-seen.description = When the device last reported anything to the gateway.
channel-type.gardenalocal.light-intensity.label = Light Intensity
channel-type.gardenalocal.light-intensity.description = The light intensity (smart Sensor only).
channel-type.gardenalocal.mower-activity.label = Activity
channel-type.gardenalocal.mower-activity.description = What the mower is doing.
channel-type.gardenalocal.mower-activity.state.option.parked = Parked
channel-type.gardenalocal.mower-activity.state.option.leaving = Leaving the charging station
channel-type.gardenalocal.mower-activity.state.option.mowing = Mowing
channel-type.gardenalocal.mower-activity.state.option.paused = Paused
channel-type.gardenalocal.mower-activity.state.option.returning = Returning to the charging station
channel-type.gardenalocal.mower-activity.state.option.charging = Charging
channel-type.gardenalocal.mower-activity.state.option.error = Error
channel-type.gardenalocal.mower-activity.state.option.unknown = Unknown
channel-type.gardenalocal.mower-command.label = Command
channel-type.gardenalocal.mower-command.description = Starts mowing for the Mowing Duration, parks the mower until its next scheduled start or until further notice (schedule paused), or pauses it where it is (second-generation mowers only).
channel-type.gardenalocal.mower-command.command.option.start = Start mowing
channel-type.gardenalocal.mower-command.command.option.park-until-next-schedule = Park until next schedule
channel-type.gardenalocal.mower-command.command.option.park-until-further-notice = Park until further notice
channel-type.gardenalocal.mower-command.command.option.pause = Pause
channel-type.gardenalocal.mower-error-code.label = Error Code
channel-type.gardenalocal.mower-error-code.description = The mower's last error code as reported by the mower, 0 for none.
channel-type.gardenalocal.mowing-duration.label = Mowing Duration
channel-type.gardenalocal.mowing-duration.description = How long a start mows, e.g. 2 h. Setting it does not start the mower. A plain number is taken as hours. Starts at the thing's mowing duration after a restart.
channel-type.gardenalocal.operating-mode.label = Operating Mode
channel-type.gardenalocal.operating-mode.description = Scheduled: the pump runs when switched on or by a schedule. Automatic: it starts by itself when the outlet pressure drops below the turn-on pressure.
channel-type.gardenalocal.operating-mode.state.option.scheduled = Scheduled
channel-type.gardenalocal.operating-mode.state.option.automatic = Automatic
channel-type.gardenalocal.outlet-pressure.label = Outlet Pressure
channel-type.gardenalocal.outlet-pressure.description = The water pressure at the pump's outlet.
channel-type.gardenalocal.outlet-temperature.label = Water Temperature
channel-type.gardenalocal.outlet-temperature.description = The water temperature at the pump's outlet.
channel-type.gardenalocal.power-duration.label = On Duration
channel-type.gardenalocal.power-duration.description = How long the outlet stays on when switched ON, e.g. 30 min; 0 keeps it on until it is switched off. Setting it does not switch the outlet. A plain number is taken as minutes. Starts at the thing's on duration after a restart.
channel-type.gardenalocal.power-state.label = Power
channel-type.gardenalocal.power-state.description = ON while the outlet is on, also when a schedule switched it on. Switching it ON turns it on for the On Duration, OFF turns it off.
channel-type.gardenalocal.pump-command.label = Command
channel-type.gardenalocal.pump-command.description = Resets a counter or the error state of the pump.
channel-type.gardenalocal.pump-command.command.option.reset-flow = Reset volume since reset
channel-type.gardenalocal.pump-command.command.option.reset-errors = Reset errors
channel-type.gardenalocal.pump-command.command.option.reset-temperature-min-max = Reset temperature min/max
channel-type.gardenalocal.pump-duration.label = Run Duration
channel-type.gardenalocal.pump-duration.description = How long the pump runs when switched ON, e.g. 15 min. Setting it does not start the pump. A plain number is taken as minutes. Starts at the thing's run duration after a restart.
channel-type.gardenalocal.pump-error.label = Pump Error
channel-type.gardenalocal.pump-error.description = What the pump reports as wrong, if anything. Reset it with the reset-errors command after fixing it.
channel-type.gardenalocal.pump-error.state.option.none = None
channel-type.gardenalocal.pump-error.state.option.pump-not-filled = Pump not filled
channel-type.gardenalocal.pump-error.state.option.clean-gasket = Clean the gasket
channel-type.gardenalocal.pump-error.state.option.clean-fine-mesh = Clean the fine mesh filter
channel-type.gardenalocal.pump-error.state.option.small-leakage = Small leakage
channel-type.gardenalocal.pump-running.label = Pumping
channel-type.gardenalocal.pump-running.description = ON while the pump's motor runs, also when it started by itself. Switching it ON runs the pump for the Run Duration, OFF stops it; both only in scheduled mode.
channel-type.gardenalocal.pump-state.label = Pump State
channel-type.gardenalocal.pump-state.description = What the pump last found: whether it holds water and whether water flows.
channel-type.gardenalocal.pump-state.state.option.starting = Starting
channel-type.gardenalocal.pump-state.state.option.water-in-pump = Water in the pump
channel-type.gardenalocal.pump-state.state.option.no-water-in-pump = No water in the pump
channel-type.gardenalocal.pump-state.state.option.flow = Water flows
channel-type.gardenalocal.pump-state.state.option.no-flow = No flow after 5 s
channel-type.gardenalocal.rf-link-quality.label = Radio Link Quality
channel-type.gardenalocal.rf-link-quality.description = Quality of the radio link to the gateway (first-generation devices).
channel-type.gardenalocal.signal-strength.label = Signal Strength
channel-type.gardenalocal.signal-strength.description = Received signal strength of the radio link to the gateway (second-generation devices).
channel-type.gardenalocal.soil-moisture.label = Soil Moisture
channel-type.gardenalocal.soil-moisture.description = The soil moisture.
channel-type.gardenalocal.soil-temperature.label = Soil Temperature
channel-type.gardenalocal.soil-temperature.description = The soil temperature.
channel-type.gardenalocal.temperature.label = Temperature
channel-type.gardenalocal.temperature.description = The ambient temperature measured by the water control. Meant for frost detection rather than as a thermometer.
channel-type.gardenalocal.turn-on-pressure.label = Turn-On Pressure
channel-type.gardenalocal.turn-on-pressure.description = In automatic mode the pump starts when the outlet pressure drops below this, 0 to 10 bar. A plain number is taken as bar.
channel-type.gardenalocal.valve-connected.label = Valve Connected
channel-type.gardenalocal.valve-connected.description = ON if a valve is wired to this output.
channel-type.gardenalocal.valve-duration.label = Watering Duration
channel-type.gardenalocal.valve-duration.description = How long the valve stays open when switched ON, e.g. 15 min. Setting it does not open the valve. A plain number is taken as minutes. Starts at the thing's watering duration after a restart.
channel-type.gardenalocal.valve-error.label = Valve Error
channel-type.gardenalocal.valve-error.description = The valve's error code as reported by the device, 0 for none.
channel-type.gardenalocal.valve-name.label = Valve Name
channel-type.gardenalocal.valve-name.description = The name the valve was given in the GARDENA app.
channel-type.gardenalocal.valve-state.label = Watering
channel-type.gardenalocal.valve-state.description = ON while the valve is open. Switching it ON opens the valve for the valve's watering duration, OFF closes it.

# discovery

discovery.gardenalocal.gateway.label = GARDENA smart Gateway {0}
discovery.gardenalocal.device.label = GARDENA {0} {1}

# thing status descriptions

offline.conf-error.missing-host = The gateway's host must be configured.
offline.conf-error.invalid-host = The configured host is not a valid IP address or host name.
offline.conf-error.invalid-port = The port must be between 1 and 65535.
offline.conf-error.invalid-refresh-interval = The refresh interval must not be negative.
offline.conf-error.missing-password = The gateway's password must be configured: the first block of the gateway ID printed on its back.
offline.conf-error.password-rejected = The gateway rejected the password. Check it (the first block of the gateway ID printed on its back) and save the configuration to try again.
offline.comm-error.connection-refused = The gateway refused the connection. Is the WebSocket API enabled in the gateway's web interface? Retrying...
offline.comm-error.connection-lost = Lost the connection to the gateway ({0}), retrying...
offline.conf-error.invalid-device-id = The device ID must be 24 hexadecimal digits.
offline.conf-error.invalid-watering-duration = The watering duration must be {0} to {1} minutes.
offline.conf-error.invalid-on-duration = The on duration must be {0} to {1} minutes.
offline.conf-error.invalid-run-duration = The run duration must be {0} to {1} minutes.
offline.conf-error.invalid-mowing-duration = The mowing duration must be {0} to {1} hours.
offline.conf-error.wrong-thing-type = The device is a {0}, which is a different thing type.
offline.comm-error.device-unreachable = The gateway cannot reach the device over the radio.
offline.gone.device-not-paired = The gateway does not know this device. It may have been removed from the GARDENA app.
