# channel types

channel-type.gardenalocal.valve-state.label = Bewässerung
channel-type.gardenalocal.valve-state.description = EIN, solange das Ventil offen ist. EIN öffnet das Ventil für seine Bewässerungsdauer, AUS schließt es.
channel-type.gardenalocal.valve-duration.label = Bewässerungsdauer
channel-type.gardenalocal.valve-duration.description = Wie lange das Ventil beim Einschalten offen bleibt, z. B. 15 min. Das Setzen allein öffnet das Ventil nicht. Eine Zahl ohne Einheit gilt als Minuten. Beginnt nach einem Neustart mit der Bewässerungsdauer des Things.
channel-type.gardenalocal.battery-level.label = Batteriestand
channel-type.gardenalocal.battery-level.description = Ladezustand der Batterie in Prozent.
channel-type.gardenalocal.last-seen.label = Zuletzt gesehen
channel-type.gardenalocal.last-seen.description = Wann sich das Gerät zuletzt beim Gateway gemeldet hat.
channel-type.gardenalocal.valve-error.label = Ventilfehler
channel-type.gardenalocal.valve-error.description = Der Fehlercode des Ventils, wie ihn das Gerät meldet, 0 für keinen Fehler.
channel-type.gardenalocal.valve-name.label = Ventilname
channel-type.gardenalocal.valve-name.description = Der Name des Ventils aus der GARDENA-App.
channel-type.gardenalocal.valve-connected.label = Ventil angeschlossen
channel-type.gardenalocal.valve-connected.description = EIN, wenn an diesem Ausgang ein Ventil angeschlossen ist.
channel-type.gardenalocal.temperature.label = Temperatur
channel-type.gardenalocal.temperature.description = Die vom Water Control gemessene Umgebungstemperatur. Gedacht für die Frosterkennung, nicht als Thermometer.
channel-type.gardenalocal.frost-warning.label = Frostwarnung
channel-type.gardenalocal.frost-warning.description = EIN, solange die Temperatur unter etwa 5 °C liegt.
channel-type.gardenalocal.rf-link-quality.label = Funkverbindungsqualität
channel-type.gardenalocal.rf-link-quality.description = Qualität der Funkverbindung zum Gateway (Geräte der ersten Generation).
channel-type.gardenalocal.signal-strength.label = Funksignalstärke
channel-type.gardenalocal.signal-strength.description = Empfangene Signalstärke der Funkverbindung zum Gateway (Geräte der zweiten Generation).
channel-type.gardenalocal.soil-moisture.label = Bodenfeuchte
channel-type.gardenalocal.soil-moisture.description = Die Bodenfeuchte.
channel-type.gardenalocal.soil-temperature.label = Bodentemperatur
channel-type.gardenalocal.soil-temperature.description = Die Bodentemperatur.
channel-type.gardenalocal.ambient-temperature.label = Lufttemperatur
channel-type.gardenalocal.ambient-temperature.description = Die Lufttemperatur (nur smart Sensor).
channel-type.gardenalocal.light-intensity.label = Lichtstärke
channel-type.gardenalocal.light-intensity.description = Die Lichtstärke (nur smart Sensor).
channel-type.gardenalocal.power-state.label = Strom
channel-type.gardenalocal.power-state.description = EIN, solange die Steckdose eingeschaltet ist, auch wenn ein Zeitplan sie eingeschaltet hat. EIN schaltet sie für die Einschaltdauer ein, AUS schaltet sie aus.
channel-type.gardenalocal.power-duration.label = Einschaltdauer
channel-type.gardenalocal.power-duration.description = Wie lange die Steckdose beim Einschalten an bleibt, z. B. 30 min; 0 lässt sie bis zum Ausschalten an. Das Setzen allein schaltet die Steckdose nicht. Eine Zahl ohne Einheit gilt als Minuten. Beginnt nach einem Neustart mit der Einschaltdauer des Things.
channel-type.gardenalocal.pump-running.label = Pumpt
channel-type.gardenalocal.pump-running.description = EIN, solange der Motor der Pumpe läuft, auch wenn sie selbst gestartet ist. EIN lässt die Pumpe für die Laufzeit laufen, AUS stoppt sie; beides nur im Zeitplanmodus.
channel-type.gardenalocal.pump-duration.label = Laufzeit
channel-type.gardenalocal.pump-duration.description = Wie lange die Pumpe beim Einschalten läuft, z. B. 15 min. Das Setzen allein startet die Pumpe nicht. Eine Zahl ohne Einheit gilt als Minuten. Beginnt nach einem Neustart mit der Laufzeit des Things.
channel-type.gardenalocal.operating-mode.label = Betriebsart
channel-type.gardenalocal.operating-mode.description = Zeitplan: Die Pumpe läuft nach dem Einschalten oder nach Zeitplan. Automatik: Sie startet selbst, wenn der Ausgangsdruck unter den Einschaltdruck fällt.
channel-type.gardenalocal.operating-mode.state.option.scheduled = Zeitplan
channel-type.gardenalocal.operating-mode.state.option.automatic = Automatik
channel-type.gardenalocal.pump-state.label = Pumpenzustand
channel-type.gardenalocal.pump-state.description = Was die Pumpe zuletzt festgestellt hat: ob sie Wasser enthält und ob Wasser fließt.
channel-type.gardenalocal.pump-state.state.option.starting = Startet
channel-type.gardenalocal.pump-state.state.option.water-in-pump = Wasser in der Pumpe
channel-type.gardenalocal.pump-state.state.option.no-water-in-pump = Kein Wasser in der Pumpe
channel-type.gardenalocal.pump-state.state.option.flow = Wasser fließt
channel-type.gardenalocal.pump-state.state.option.no-flow = Kein Durchfluss nach 5 s
channel-type.gardenalocal.outlet-pressure.label = Ausgangsdruck
channel-type.gardenalocal.outlet-pressure.description = Der Wasserdruck am Ausgang der Pumpe.
channel-type.gardenalocal.outlet-temperature.label = Wassertemperatur
channel-type.gardenalocal.outlet-temperature.description = Die Wassertemperatur am Ausgang der Pumpe.
channel-type.gardenalocal.flow-rate.label = Durchfluss
channel-type.gardenalocal.flow-rate.description = Der Wasserdurchfluss, solange die Pumpe läuft, 0 im Stillstand. Die Pumpe meldet ihn in Schritten von etwa 76 l/h.
channel-type.gardenalocal.flow-total.label = Gesamtmenge
channel-type.gardenalocal.flow-total.description = Die über die Lebensdauer der Pumpe geförderte Wassermenge.
channel-type.gardenalocal.flow-since-reset.label = Menge seit Zurücksetzen
channel-type.gardenalocal.flow-since-reset.description = Die seit dem letzten Zurücksetzen mit dem Befehl reset-flow geförderte Wassermenge.
channel-type.gardenalocal.turn-on-pressure.label = Einschaltdruck
channel-type.gardenalocal.turn-on-pressure.description = Im Automatikmodus startet die Pumpe, wenn der Ausgangsdruck darunter fällt, 0 bis 10 bar. Eine Zahl ohne Einheit gilt als bar.
channel-type.gardenalocal.dripping-alert.label = Tropfwarnung
channel-type.gardenalocal.dripping-alert.description = Wann die Pumpe eine kleine Undichtigkeit meldet: nach 60 Minuten Tropfen (Standard), nach 2 Minuten (empfindlich) oder nie (aus).
channel-type.gardenalocal.dripping-alert.state.option.standard = Nach 60 Minuten
channel-type.gardenalocal.dripping-alert.state.option.sensitive = Nach 2 Minuten
channel-type.gardenalocal.dripping-alert.state.option.off = Aus
channel-type.gardenalocal.pump-error.label = Pumpenfehler
channel-type.gardenalocal.pump-error.description = Was die Pumpe als Fehler meldet, falls etwas. Nach der Behebung mit dem Befehl reset-errors zurücksetzen.
channel-type.gardenalocal.pump-error.state.option.none = Keiner
channel-type.gardenalocal.pump-error.state.option.pump-not-filled = Pumpe nicht befüllt
channel-type.gardenalocal.pump-error.state.option.clean-gasket = Dichtung reinigen
channel-type.gardenalocal.pump-error.state.option.clean-fine-mesh = Feinfilter reinigen
channel-type.gardenalocal.pump-error.state.option.small-leakage = Kleine Undichtigkeit
channel-type.gardenalocal.pump-command.label = Befehl
channel-type.gardenalocal.pump-command.description = Setzt einen Zähler oder den Fehlerzustand der Pumpe zurück.
channel-type.gardenalocal.pump-command.command.option.reset-flow = Menge seit Zurücksetzen zurücksetzen
channel-type.gardenalocal.pump-command.command.option.reset-errors = Fehler zurücksetzen
channel-type.gardenalocal.pump-command.command.option.reset-temperature-min-max = Temperatur-Min/Max zurücksetzen
channel-type.gardenalocal.mower-activity.label = Aktivität
channel-type.gardenalocal.mower-activity.description = Was der Mähroboter gerade tut.
channel-type.gardenalocal.mower-activity.state.option.parked = Geparkt
channel-type.gardenalocal.mower-activity.state.option.leaving = Verlässt die Ladestation
channel-type.gardenalocal.mower-activity.state.option.mowing = Mäht
channel-type.gardenalocal.mower-activity.state.option.paused = Pausiert
channel-type.gardenalocal.mower-activity.state.option.returning = Kehrt zur Ladestation zurück
channel-type.gardenalocal.mower-activity.state.option.charging = Lädt
channel-type.gardenalocal.mower-activity.state.option.error = Fehler
channel-type.gardenalocal.mower-activity.state.option.unknown = Unbekannt
channel-type.gardenalocal.mower-command.label = Befehl
channel-type.gardenalocal.mower-command.description = Startet das Mähen für die Mähdauer, parkt den Mähroboter bis zum nächsten geplanten Start oder bis auf Weiteres (Zeitplan ausgesetzt) oder pausiert ihn an Ort und Stelle (nur zweite Generation).
channel-type.gardenalocal.mower-command.command.option.start = Mähen starten
channel-type.gardenalocal.mower-command.command.option.park-until-next-schedule = Parken bis zum nächsten Zeitplan
channel-type.gardenalocal.mower-command.command.option.park-until-further-notice = Parken bis auf Weiteres
channel-type.gardenalocal.mower-command.command.option.pause = Pausieren
channel-type.gardenalocal.mowing-duration.label = Mähdauer
channel-type.gardenalocal.mowing-duration.description = Wie lange ein Start mäht, z. B. 2 h. Das Setzen allein startet den Mähroboter nicht. Eine Zahl ohne Einheit gilt als Stunden. Beginnt nach einem Neustart mit der Mähdauer des Things.
channel-type.gardenalocal.mower-error-code.label = Fehlercode
channel-type.gardenalocal.mower-error-code.description = Der letzte Fehlercode, wie ihn der Mähroboter meldet, 0 für keinen Fehler.
channel-type.gardenalocal.cutting-time.label = Messerlaufzeit
channel-type.gardenalocal.cutting-time.description = Wie lange die Messerscheibe über die Lebensdauer des Mähroboters gelaufen ist (erste Generation).
channel-type.gardenalocal.charging-cycles.label = Ladezyklen
channel-type.gardenalocal.charging-cycles.description = Abgeschlossene Ladezyklen über die Lebensdauer des Mähroboters (erste Generation).
channel-type.gardenalocal.collisions.label = Kollisionen
channel-type.gardenalocal.collisions.description = Kollisionen über die Lebensdauer des Mähroboters (erste Generation).

