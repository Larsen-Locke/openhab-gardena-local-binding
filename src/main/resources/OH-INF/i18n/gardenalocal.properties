# add-on

addon.gardenalocal.name = GARDENA smart local Binding
addon.gardenalocal.description = Controls GARDENA smart irrigation controls and water controls and reads GARDENA smart sensors through the local WebSocket API of the GARDENA smart Gateway, without the GARDENA cloud.

# thing types

thing-type.gardenalocal.gateway.label = GARDENA smart Gateway
thing-type.gardenalocal.gateway.description = The GARDENA smart Gateway, reached over its local WebSocket API. The WebSocket API has to be enabled once in the gateway's web interface.
thing-type.gardenalocal.irrigation-control.label = GARDENA smart Irrigation Control
thing-type.gardenalocal.irrigation-control.description = A smart Irrigation Control with six 24 V valve outputs.
thing-type.gardenalocal.irrigation-control.group.valve1.label = Valve 1
thing-type.gardenalocal.irrigation-control.group.valve2.label = Valve 2
thing-type.gardenalocal.irrigation-control.group.valve3.label = Valve 3
thing-type.gardenalocal.irrigation-control.group.valve4.label = Valve 4
thing-type.gardenalocal.irrigation-control.group.valve5.label = Valve 5
thing-type.gardenalocal.irrigation-control.group.valve6.label = Valve 6
thing-type.gardenalocal.water-control.label = GARDENA smart Water Control
thing-type.gardenalocal.water-control.description = A smart Water Control or smart Pipeline Water Control with one valve.
thing-type.gardenalocal.dual-water-control.label = GARDENA smart Dual Water Control
thing-type.gardenalocal.dual-water-control.description = A smart Dual Water Control with two valves.
thing-type.gardenalocal.dual-water-control.group.valve1.label = Valve 1
thing-type.gardenalocal.dual-water-control.group.valve2.label = Valve 2
thing-type.gardenalocal.sensor.label = GARDENA smart Sensor
thing-type.gardenalocal.sensor.description = A smart Sensor or smart Sensor II. Air temperature and light intensity are only measured by the smart Sensor.

# thing types config

thing-type.config.gardenalocal.gateway.host.label = Host
thing-type.config.gardenalocal.gateway.host.description = IP address or host name of the gateway, e.g. 192.168.1.20 or GARDENA-123456.local.
thing-type.config.gardenalocal.gateway.password.label = Password
thing-type.config.gardenalocal.gateway.password.description = The first block of the gateway ID printed on the back of the gateway, e.g. 1234abcd for the ID 1234abcd-996c-48f7-83dc-d2d1bac08e7e.
thing-type.config.gardenalocal.gateway.port.label = Port
thing-type.config.gardenalocal.gateway.port.description = Port of the gateway's WebSocket service.
thing-type.config.gardenalocal.sensor.deviceId.label = Device ID
thing-type.config.gardenalocal.sensor.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.valve-device.deviceId.label = Device ID
thing-type.config.gardenalocal.valve-device.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.valve-device.wateringDuration.label = Watering Duration
thing-type.config.gardenalocal.valve-device.wateringDuration.description = How long a valve stays open when its Watering channel is switched ON, in minutes. The device closes the valve by itself when the time is up.

# channel group types

channel-group-type.gardenalocal.valve.label = Valve
channel-group-type.gardenalocal.irrigation-valve.label = Valve
channel-group-type.gardenalocal.irrigation-control-status.label = Device
channel-group-type.gardenalocal.water-control-status.label = Device

# channel types

channel-type.gardenalocal.valve-state.label = Watering
channel-type.gardenalocal.valve-state.description = ON while the valve is open. Switching it ON opens the valve for the thing's watering duration, OFF closes it.
channel-type.gardenalocal.valve-duration.label = Water For
channel-type.gardenalocal.valve-duration.description = Opens the valve for the commanded duration, e.g. 15 min. 0 closes it. A plain number is taken as minutes.
channel-type.gardenalocal.valve-error.label = Valve Error
channel-type.gardenalocal.valve-error.description = The valve's error code as reported by the device, 0 for none.
channel-type.gardenalocal.valve-name.label = Valve Name
channel-type.gardenalocal.valve-name.description = The name the valve was given in the GARDENA app.
channel-type.gardenalocal.valve-connected.label = Valve Connected
channel-type.gardenalocal.valve-connected.description = ON if a valve is wired to this output.
channel-type.gardenalocal.temperature.label = Temperature
channel-type.gardenalocal.temperature.description = The ambient temperature measured by the water control. Meant for frost detection rather than as a thermometer.
channel-type.gardenalocal.frost-warning.label = Frost Warning
channel-type.gardenalocal.frost-warning.description = ON while the temperature is below about 5 °C.
channel-type.gardenalocal.rf-link-quality.label = Radio Link Quality
channel-type.gardenalocal.rf-link-quality.description = Quality of the radio link to the gateway (first-generation devices).
channel-type.gardenalocal.signal-strength.label = Radio Signal Strength
channel-type.gardenalocal.signal-strength.description = Received signal strength of the radio link to the gateway (second-generation devices).
channel-type.gardenalocal.soil-moisture.label = Soil Moisture
channel-type.gardenalocal.soil-moisture.description = The soil moisture.
channel-type.gardenalocal.soil-temperature.label = Soil Temperature
channel-type.gardenalocal.soil-temperature.description = The soil temperature.
channel-type.gardenalocal.ambient-temperature.label = Air Temperature
channel-type.gardenalocal.ambient-temperature.description = The air temperature (smart Sensor only).
channel-type.gardenalocal.light-intensity.label = Light Intensity
channel-type.gardenalocal.light-intensity.description = The light intensity (smart Sensor only).

# discovery

discovery.gardenalocal.gateway.label = GARDENA smart Gateway {0}
discovery.gardenalocal.device.label = GARDENA {0} {1}

# thing status descriptions

offline.conf-error.missing-host = The gateway's host must be configured.
offline.conf-error.invalid-host = The configured host is not a valid IP address or host name.
offline.conf-error.invalid-port = The port must be between 1 and 65535.
offline.conf-error.missing-password = The gateway's password must be configured: the first block of the gateway ID printed on its back.
offline.conf-error.password-rejected = The gateway rejected the password. Check it (the first block of the gateway ID printed on its back) and save the configuration to try again.
offline.comm-error.connection-refused = The gateway refused the connection. Is the WebSocket API enabled in the gateway's web interface? Retrying...
offline.comm-error.connection-lost = Lost the connection to the gateway ({0}), retrying...
offline.conf-error.invalid-device-id = The device ID must be 24 hexadecimal digits.
offline.conf-error.invalid-watering-duration = The watering duration must be {0} to {1} minutes.
offline.conf-error.wrong-thing-type = The device is a {0}, which is a different thing type.
offline.comm-error.device-unreachable = The gateway cannot reach the device over the radio.
offline.gone.device-not-paired = The gateway does not know this device. It may have been removed from the GARDENA app.
