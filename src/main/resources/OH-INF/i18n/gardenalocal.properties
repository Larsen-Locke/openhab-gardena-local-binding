# add-on

addon.gardenalocal.name = GARDENA Binding (local)
addon.gardenalocal.description = Controls GARDENA smart irrigation controls, water controls, power adapters, pumps and SILENO mowers and reads GARDENA smart sensors through the local WebSocket API of the GARDENA smart Gateway, without the GARDENA cloud.

# thing types

thing-type.gardenalocal.dual-water-control.label = Dual Water Control
thing-type.gardenalocal.dual-water-control.description = A smart Dual Water Control with two valves.
thing-type.gardenalocal.dual-water-control.group.valve1.label = Valve 1
thing-type.gardenalocal.dual-water-control.group.valve2.label = Valve 2
thing-type.gardenalocal.gateway.label = GARDENA smart Gateway
thing-type.gardenalocal.gateway.description = The GARDENA smart Gateway, reached over its local WebSocket API. The WebSocket API has to be enabled once in the gateway's web interface.
thing-type.gardenalocal.irrigation-control.label = Irrigation Control
thing-type.gardenalocal.irrigation-control.description = A smart Irrigation Control with six 24 V valve outputs.
thing-type.gardenalocal.irrigation-control.group.valve1.label = Valve 1
thing-type.gardenalocal.irrigation-control.group.valve2.label = Valve 2
thing-type.gardenalocal.irrigation-control.group.valve3.label = Valve 3
thing-type.gardenalocal.irrigation-control.group.valve4.label = Valve 4
thing-type.gardenalocal.irrigation-control.group.valve5.label = Valve 5
thing-type.gardenalocal.irrigation-control.group.valve6.label = Valve 6
thing-type.gardenalocal.mower.label = SILENO Mower
thing-type.gardenalocal.mower.description = A SILENO robotic mower: smart SILENO, SILENO+, city, life (also with LONA), pro, max and free.
thing-type.gardenalocal.power-adapter.label = smart Power Adapter
thing-type.gardenalocal.power-adapter.description = A smart Power Adapter: an outlet that is switched on for a duration or until switched off.
thing-type.gardenalocal.pump.label = Home & Garden Pump
thing-type.gardenalocal.pump.description = A smart Automatic Home & Garden Pump. In scheduled mode it runs for a duration when switched ON; in automatic mode it starts by itself when the outlet pressure drops and ignores manual starts.
thing-type.gardenalocal.sensor.label = GARDENA smart Sensor
thing-type.gardenalocal.sensor.description = A smart Sensor or smart Sensor II. Air temperature and light intensity are only measured by the smart Sensor.
thing-type.gardenalocal.water-control.label = Water Control
thing-type.gardenalocal.water-control.description = A smart Water Control or smart Pipeline Water Control with one valve.

# thing types config

thing-type.config.gardenalocal.gateway.host.label = Host
thing-type.config.gardenalocal.gateway.host.description = IP address or host name of the gateway, e.g. 192.168.1.20 or GARDENA-123456.local.
thing-type.config.gardenalocal.gateway.password.label = Password
thing-type.config.gardenalocal.gateway.password.description = The first block of the gateway ID printed on the back of the gateway, e.g. 1234abcd for the ID 1234abcd-996c-48f7-83dc-d2d1bac08e7e.
thing-type.config.gardenalocal.gateway.port.label = Port
thing-type.config.gardenalocal.gateway.port.description = Port of the gateway's WebSocket service.
thing-type.config.gardenalocal.gateway.refreshInterval.label = Refresh Interval
thing-type.config.gardenalocal.gateway.refreshInterval.description = How often the device list is read again, in minutes. The gateway only reports changed values on its own, so this keeps Last Seen current. 0 turns it off.
thing-type.config.gardenalocal.mower.deviceId.label = Device ID
thing-type.config.gardenalocal.mower.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.mower.mowingDuration.label = Mowing Duration
thing-type.config.gardenalocal.mower.mowingDuration.description = How long the mower mows when started, in hours, until its Mowing Duration channel is set to something else.
thing-type.config.gardenalocal.power-adapter.deviceId.label = Device ID
thing-type.config.gardenalocal.power-adapter.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.power-adapter.onDuration.label = On Duration
thing-type.config.gardenalocal.power-adapter.onDuration.description = How long the outlet stays on when switched ON, in minutes, until its On Duration channel is set to something else. 0 keeps it on until it is switched off.
thing-type.config.gardenalocal.pump.deviceId.label = Device ID
thing-type.config.gardenalocal.pump.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.pump.runDuration.label = Run Duration
thing-type.config.gardenalocal.pump.runDuration.description = How long the pump runs when switched ON, in minutes, until its Run Duration channel is set to something else. The pump stops by itself when the time is up.
thing-type.config.gardenalocal.sensor.deviceId.label = Device ID
thing-type.config.gardenalocal.sensor.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.valve-device.deviceId.label = Device ID
thing-type.config.gardenalocal.valve-device.deviceId.description = The device's ID on the gateway, 24 hexadecimal digits. Filled in by discovery.
thing-type.config.gardenalocal.valve-device.wateringDuration.label = Watering Duration
thing-type.config.gardenalocal.valve-device.wateringDuration.description = How long a valve stays open when switched ON, in minutes, until its Watering Duration channel is set to something else. The device closes the valve by itself when the time is up.

