# add-on

addon.gardenalocal.name = GARDENA smart local Binding
addon.gardenalocal.description = Steuert GARDENA smart Bewässerungssteuerungen und Water Controls und liest GARDENA smart Sensoren über die lokale WebSocket-API des GARDENA smart Gateways, ohne die GARDENA-Cloud.

# thing types

thing-type.gardenalocal.gateway.label = GARDENA smart Gateway
thing-type.gardenalocal.gateway.description = Das GARDENA smart Gateway, erreicht über seine lokale WebSocket-API. Die WebSocket-API muss einmalig in der Weboberfläche des Gateways eingeschaltet werden.
thing-type.gardenalocal.irrigation-control.label = GARDENA smart Irrigation Control
thing-type.gardenalocal.irrigation-control.description = Eine smart Irrigation Control (Bewässerungssteuerung) mit sechs 24-V-Ventilausgängen.
thing-type.gardenalocal.irrigation-control.group.valve1.label = Ventil 1
thing-type.gardenalocal.irrigation-control.group.valve2.label = Ventil 2
thing-type.gardenalocal.irrigation-control.group.valve3.label = Ventil 3
thing-type.gardenalocal.irrigation-control.group.valve4.label = Ventil 4
thing-type.gardenalocal.irrigation-control.group.valve5.label = Ventil 5
thing-type.gardenalocal.irrigation-control.group.valve6.label = Ventil 6
thing-type.gardenalocal.water-control.label = GARDENA smart Water Control
thing-type.gardenalocal.water-control.description = Ein smart Water Control oder smart Pipeline Water Control mit einem Ventil.
thing-type.gardenalocal.dual-water-control.label = GARDENA smart Dual Water Control
thing-type.gardenalocal.dual-water-control.description = Ein smart Dual Water Control mit zwei Ventilen.
thing-type.gardenalocal.dual-water-control.group.valve1.label = Ventil 1
thing-type.gardenalocal.dual-water-control.group.valve2.label = Ventil 2
thing-type.gardenalocal.sensor.label = GARDENA smart Sensor
thing-type.gardenalocal.sensor.description = Ein smart Sensor oder smart Sensor II. Lufttemperatur und Lichtstärke misst nur der smart Sensor.

# thing types config

thing-type.config.gardenalocal.gateway.host.label = Host
thing-type.config.gardenalocal.gateway.host.description = IP-Adresse oder Hostname des Gateways, z. B. 192.168.1.20 oder GARDENA-123456.local.
thing-type.config.gardenalocal.gateway.password.label = Passwort
thing-type.config.gardenalocal.gateway.password.description = Der erste Block der Gateway-ID auf der Rückseite des Gateways, z. B. 1234abcd bei der ID 1234abcd-996c-48f7-83dc-d2d1bac08e7e.
thing-type.config.gardenalocal.gateway.port.label = Port
thing-type.config.gardenalocal.gateway.port.description = Port des WebSocket-Dienstes des Gateways.
thing-type.config.gardenalocal.gateway.refreshInterval.label = Aktualisierungsintervall
thing-type.config.gardenalocal.gateway.refreshInterval.description = Wie oft die Geräteliste neu gelesen wird, in Minuten. Von sich aus meldet das Gateway nur geänderte Werte; so bleibt Zuletzt gesehen aktuell. 0 schaltet es ab.
thing-type.config.gardenalocal.sensor.deviceId.label = Geräte-ID
thing-type.config.gardenalocal.sensor.deviceId.description = Die ID des Geräts im Gateway, 24 Hexadezimalziffern. Wird von der Suche eingetragen.
thing-type.config.gardenalocal.valve-device.deviceId.label = Geräte-ID
thing-type.config.gardenalocal.valve-device.deviceId.description = Die ID des Geräts im Gateway, 24 Hexadezimalziffern. Wird von der Suche eingetragen.
thing-type.config.gardenalocal.valve-device.wateringDuration.label = Bewässerungsdauer
thing-type.config.gardenalocal.valve-device.wateringDuration.description = Wie lange ein Ventil beim Einschalten offen bleibt, in Minuten, solange sein Kanal Bewässerungsdauer nicht anders gesetzt wird. Das Gerät schließt das Ventil nach Ablauf selbst.

# channel group types

channel-group-type.gardenalocal.valve.label = Ventil
channel-group-type.gardenalocal.irrigation-valve.label = Ventil
channel-group-type.gardenalocal.irrigation-control-status.label = Gerät
channel-group-type.gardenalocal.water-control-status.label = Gerät

# channel types

channel-type.gardenalocal.valve-state.label = Bewässerung
channel-type.gardenalocal.valve-state.description = EIN, solange das Ventil offen ist. EIN öffnet das Ventil für seine Bewässerungsdauer, AUS schließt es.
channel-type.gardenalocal.valve-duration.label = Bewässerungsdauer
channel-type.gardenalocal.valve-duration.description = Wie lange das Ventil beim Einschalten offen bleibt, z. B. 15 min. Das Setzen allein öffnet das Ventil nicht. Eine Zahl ohne Einheit gilt als Minuten. Beginnt nach einem Neustart mit der Bewässerungsdauer des Things.
channel-type.gardenalocal.battery-level.label = Batteriestand
channel-type.gardenalocal.battery-level.description = Ladezustand der Batterie in Prozent.
channel-type.gardenalocal.last-seen.label = Zuletzt gesehen
channel-type.gardenalocal.last-seen.description = Wann sich das Gerät zuletzt beim Gateway gemeldet hat.
channel-type.gardenalocal.valve-error.label = Ventilfehler
channel-type.gardenalocal.valve-error.description = Der Fehlercode des Ventils, wie ihn das Gerät meldet, 0 für keinen Fehler.
channel-type.gardenalocal.valve-name.label = Ventilname
channel-type.gardenalocal.valve-name.description = Der Name des Ventils aus der GARDENA-App.
channel-type.gardenalocal.valve-connected.label = Ventil angeschlossen
channel-type.gardenalocal.valve-connected.description = EIN, wenn an diesem Ausgang ein Ventil angeschlossen ist.
channel-type.gardenalocal.temperature.label = Temperatur
channel-type.gardenalocal.temperature.description = Die vom Water Control gemessene Umgebungstemperatur. Gedacht für die Frosterkennung, nicht als Thermometer.
channel-type.gardenalocal.frost-warning.label = Frostwarnung
channel-type.gardenalocal.frost-warning.description = EIN, solange die Temperatur unter etwa 5 °C liegt.
channel-type.gardenalocal.rf-link-quality.label = Funkverbindungsqualität
channel-type.gardenalocal.rf-link-quality.description = Qualität der Funkverbindung zum Gateway (Geräte der ersten Generation).
channel-type.gardenalocal.signal-strength.label = Funksignalstärke
channel-type.gardenalocal.signal-strength.description = Empfangene Signalstärke der Funkverbindung zum Gateway (Geräte der zweiten Generation).
channel-type.gardenalocal.soil-moisture.label = Bodenfeuchte
channel-type.gardenalocal.soil-moisture.description = Die Bodenfeuchte.
channel-type.gardenalocal.soil-temperature.label = Bodentemperatur
channel-type.gardenalocal.soil-temperature.description = Die Bodentemperatur.
channel-type.gardenalocal.ambient-temperature.label = Lufttemperatur
channel-type.gardenalocal.ambient-temperature.description = Die Lufttemperatur (nur smart Sensor).
channel-type.gardenalocal.light-intensity.label = Lichtstärke
channel-type.gardenalocal.light-intensity.description = Die Lichtstärke (nur smart Sensor).

# discovery

discovery.gardenalocal.gateway.label = GARDENA smart Gateway {0}
discovery.gardenalocal.device.label = GARDENA {0} {1}

# thing status descriptions

offline.conf-error.missing-host = Der Host des Gateways muss konfiguriert sein.
offline.conf-error.invalid-host = Der konfigurierte Host ist keine gültige IP-Adresse und kein gültiger Hostname.
offline.conf-error.invalid-port = Der Port muss zwischen 1 und 65535 liegen.
offline.conf-error.invalid-refresh-interval = Das Aktualisierungsintervall darf nicht negativ sein.
offline.conf-error.missing-password = Das Passwort des Gateways muss konfiguriert sein: der erste Block der Gateway-ID auf der Rückseite.
offline.conf-error.password-rejected = Das Gateway hat das Passwort abgelehnt. Bitte prüfen (erster Block der Gateway-ID auf der Rückseite) und die Konfiguration speichern, um es erneut zu versuchen.
offline.comm-error.connection-refused = Das Gateway hat die Verbindung abgelehnt. Ist die WebSocket-API in der Weboberfläche des Gateways eingeschaltet? Neuer Versuch folgt...
offline.comm-error.connection-lost = Verbindung zum Gateway verloren ({0}), neuer Versuch folgt...
offline.conf-error.invalid-device-id = Die Geräte-ID muss aus 24 Hexadezimalziffern bestehen.
offline.conf-error.invalid-watering-duration = Die Bewässerungsdauer muss zwischen {0} und {1} Minuten liegen.
offline.conf-error.wrong-thing-type = Das Gerät ist ein {0} und gehört zu einem anderen Thing-Typ.
offline.comm-error.device-unreachable = Das Gateway erreicht das Gerät nicht per Funk.
offline.gone.device-not-paired = Das Gateway kennt dieses Gerät nicht. Möglicherweise wurde es in der GARDENA-App entfernt.
